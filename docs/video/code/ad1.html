<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const pop = (x) => { if (x <= 0) return 0.001; const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const icon = (k, size = 90, stroke = '#14212B') => `<svg width="${size}" height="${size}" viewBox="0 0 90 90" style="stroke:${stroke};stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round">${ICON[k]}</svg>`;

// --- build repeated pieces once -------------------------------------------------------------
// scene 2: 10 x 7 people; three of them (under 5%) light up gold
const lit = [12, 37, 58];
for (let r = 0; r < 7; r++) for (let c = 0; c < 10; c++) {
  const i = r * 10 + c, d = document.createElement('div');
  d.className = 'abs'; d.id = 'p' + i;
  d.style.cssText = `left:${c * 78}px;top:${r * 80}px;width:60px;height:66px`;
  d.innerHTML = '<svg width="60" height="66" viewBox="0 0 60 66"><circle cx="30" cy="20" r="14" fill="currentColor"/><path d="M6 64c0-16 10-26 24-26s24 10 24 26z" fill="currentColor"/></svg>';
  d.style.color = 'rgba(255,255,255,.85)';
  $('s2grid').appendChild(d);
}
// scene 3: five result cards
for (let i = 0; i < 5; i++) {
  const d = document.createElement('div'); d.className = 'card'; d.id = 'r' + i;
  d.style.cssText = `left:150px;top:${730 + i * 150}px;width:780px;height:124px;border-radius:30px`;
  d.innerHTML = `<div class="abs" style="left:34px;top:30px;width:64px;height:64px;border-radius:18px;background:#EEF4FA"></div>
    <div class="abs" style="left:124px;top:38px;width:${420 - i * 30}px;height:18px;border-radius:9px;background:#D9D6CC"></div>
    <div class="abs" style="left:124px;top:72px;width:${280 - i * 20}px;height:14px;border-radius:7px;background:#E7E5DE"></div>`;
  $('s3list').appendChild(d);
}
// scene 5: pins dropping on Antigua and Barbuda (caterers, salons, photographers, nail techs)
const pins5 = [[455,1360], [398,1446], [540,1506], [569,1396], [683,1476], [502,877], [540,977]]; // 5 on Antigua (St. John's, Jolly Harbour, Liberta, Parham, Freetown), 2 on Barbuda
pins5.forEach(([x, y], i) => {
  const d = document.createElement('div'); d.className = 'abs'; d.id = 'q' + i;
  d.style.cssText = `left:${x - 30}px;top:${y - 76}px;width:60px;height:76px`;
  d.innerHTML = '<svg viewBox="0 0 150 190" width="60" height="76"><path d="M75 6C39 6 12 33 12 68c0 46 63 106 63 106s63-60 63-106C138 33 111 6 75 6z" fill="#0072C6"/><circle cx="75" cy="66" r="30" fill="#fff"/></svg>';
  $('s5pins').appendChild(d);
});
// scene 6: three nail-technician businesses (fictional names); the middle one is "your business"
const biz6 = [['Gloss Nail Bar', 'polish', 40], ['YOUR BUSINESS', 'polish', 390], ['Tip Top Nails', 'polish', 740]];
biz6.forEach(([name, ic, x], i) => {
  const d = document.createElement('div'); d.className = 'card'; d.id = 'b' + i;
  d.style.cssText = `left:${x}px;top:800px;width:300px;height:430px;${i === 1 ? 'outline:7px solid #FCD116;outline-offset:6px;' : ''}`;
  d.innerHTML = `<div class="abs" style="left:75px;top:56px;width:150px;height:150px;border-radius:36px;background:${i === 1 ? '#FFF4C2' : '#EEF4FA'};display:flex;align-items:center;justify-content:center">${icon(ic, 96, i === 1 ? '#0072C6' : '#14212B')}</div>
    <div class="t1 abs" style="left:18px;right:18px;top:248px;text-align:center;font-size:${i === 1 ? 36 : 38}px;line-height:1.1;color:${i === 1 ? '#0072C6' : '#14212B'}">${name}</div>
    <div class="abs" style="left:70px;right:70px;top:${i === 1 ? 346 : 346}px;height:14px;border-radius:7px;background:#E7E5DE"></div>
    ${i === 1 ? '<div class="abs" style="top:-30px;right:-30px;width:70px;height:70px;border-radius:50%;background:#FCD116;box-shadow:0 0 30px rgba(252,209,22,.8)"></div>' : ''}`;
  $('s6cards').appendChild(d);
});
// scene 7: call / message / book
[['phone', 'Call', 150], ['chat', 'Message', 420], ['cal', 'Book', 690]].forEach(([ic, label, x], i) => {
  const d = document.createElement('div'); d.className = 'abs'; d.id = 'c' + i;
  d.style.cssText = `left:${x}px;top:820px;width:240px;height:340px`;
  d.innerHTML = `<div class="abs ripple" id="cr${i}" style="left:120px;top:120px;border-radius:50%;border:5px solid rgba(255,255,255,.9)"></div>
    <div class="card" style="left:0;top:0;width:240px;height:240px;border-radius:50%;background:#0072C6;display:flex;align-items:center;justify-content:center">${icon(ic, 120, '#fff')}</div>
    <div class="t1 abs" style="left:-20px;right:-20px;top:268px;text-align:center;font-size:48px;color:#fff">${label}</div>
    ${i === 2 ? '<div class="abs" id="c2ok" style="left:170px;top:-20px;width:84px;height:84px;border-radius:50%;background:#1F9D55;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:16px;border-left:8px solid #fff;border-bottom:8px solid #fff;transform:rotate(-45deg) translate(3px,-4px)"></div></div>' : ''}`;
  $('s7btns').appendChild(d);
});
// scene 8: messages arriving on the phone (one per trade)
[['chat', 'New message', 'Can you cater 50 people Saturday?'], ['cal', 'New booking', 'Gel nails · Fri 2:00 PM'], ['chat', 'New message', 'Are you free for a wedding shoot?'], ['phone', 'Call', 'Hair appointment for tomorrow?']]
  .forEach(([ic, a, b], i) => {
    const d = document.createElement('div'); d.className = 'card'; d.id = 'n' + i;
    d.style.cssText = `left:200px;top:${700 + i * 190}px;width:680px;height:160px;border-radius:34px`;
    d.innerHTML = `<div class="abs" style="left:26px;top:30px;width:100px;height:100px;border-radius:26px;background:#0072C6;display:flex;align-items:center;justify-content:center">${icon(ic, 64, '#fff')}</div>
      <div class="t1 abs" style="left:150px;top:30px;font-size:40px">${a}</div><div class="t2 abs" style="left:150px;top:88px;right:24px;font-size:31px;white-space:nowrap;overflow:hidden">${b}</div>`;
    $('s8notes').appendChild(d);
  });

// --- timeline (seconds), matching the voice lines ------------------------------------------
const SCENES = [['s1', 0, 4], ['s2', 4, 9], ['s3', 9, 13], ['s4', 13, 16], ['s5', 16, 21], ['s6', 21, 26], ['s7', 26, 30], ['s8', 30, 34], ['s9', 34, 38]];
const END = 38;

function heads(scene, u, start = 0.15, step = 0.24) {
  [...$(scene).querySelectorAll('.head span')].forEach((w, i) => {
    const p = seg(u, start + i * step, start + i * step + 0.35);
    w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 40}px)`;
  });
}
function typeInto(el, text, u, a, b) { el.textContent = text.slice(0, Math.round(text.length * seg(u, a, b))); }
function ring(el, cx, cy, p, maxSize, alpha = 0.9) {
  const s = 10 + easeOut(p) * maxSize;
  el.style.left = cx - s / 2 + 'px'; el.style.top = cy - s / 2 + 'px'; el.style.width = el.style.height = s + 'px';
  el.style.opacity = p <= 0 || p >= 1 ? 0 : (1 - p) * alpha;
}

const draw = {
  s1(u) {
    heads('s1', u);
    const c = seg(u, 0.4, 0.95), g = easeOut(seg(u, 2.7, 3.4));
    $('s1card').style.transform = `scale(${pop(c)}) rotate(${(1 - c) * -4}deg)`;
    $('s1card').style.opacity = c > 0 ? 1 : 0;
    $('s1card').style.filter = `grayscale(${g}) brightness(${1 - 0.38 * g})`;
    $('s1tick').style.transform = `scale(${pop(seg(u, 1.1, 1.4))})`;
    ring($('s1r1'), 540, 960, seg(u, 1.4, 2.7), 1100); ring($('s1r2'), 540, 960, seg(u, 1.85, 3.15), 1100);
  },
  s2(u) {
    heads('s2', u);
    for (let i = 0; i < 70; i++) {
      const r = Math.floor(i / 10), p = seg(u, 0.3 + r * 0.12 + (i % 10) * 0.012, 0.6 + r * 0.12 + (i % 10) * 0.012);
      const el = $('p' + i), on = lit.indexOf(i);
      el.style.transform = `scale(${pop(p)})`; el.style.opacity = p > 0 ? 1 : 0;
      if (on >= 0) {
        const L = easeOut(seg(u, 1.6 + on * 0.25, 1.9 + on * 0.25));
        el.style.color = `rgb(${lerp(255, 252, L)},${lerp(255, 209, L)},${lerp(255, 22, L)})`;
        el.style.filter = L > 0 ? `drop-shadow(0 0 ${18 * L}px rgba(252,209,22,.9))` : 'none';
      } else el.style.color = `rgba(255,255,255,${0.85 - 0.5 * seg(u, 1.6, 2.4)})`;
    }
    const c = seg(u, 2.3, 2.8);
    $('s2card').style.transform = `translateY(${(1 - easeOut(c)) * 300}px)`; $('s2card').style.opacity = c > 0 ? 1 : 0;
    // three coins, one after another: paying again and again
    let shake = 0, paid = 0;
    const coin = $('s2coin');
    coin.style.opacity = 0;
    [2.9, 3.4, 3.9].forEach((s) => {
      const p = seg(u, s, s + 0.35);
      if (p > 0 && p < 1) { coin.style.opacity = 1; coin.style.top = lerp(860, 1150, easeInOut(p)) + 'px'; }
      if (u >= s + 0.35) { paid++; shake = Math.max(shake, 1 - seg(u, s + 0.35, s + 0.6)); }
    });
    $('s2cost').textContent = '$'.repeat(Math.max(1, paid + 1));
    if (c >= 1) $('s2card').style.transform = `translateX(${Math.sin(u * 60) * 10 * shake}px)`;
  },
  s3(u) {
    heads('s3', u);
    const b = seg(u, 0.25, 0.6);
    $('s3bar').style.transform = `scale(${pop(b)})`; $('s3bar').style.opacity = b > 0 ? 1 : 0;
    typeInto($('s3typed'), 'hair salon near me', u, 0.6, 1.3);
    for (let i = 0; i < 5; i++) {
      const p = seg(u, 1.3 + i * 0.1, 1.65 + i * 0.1), el = $('r' + i);
      let y = (1 - easeOut(p)) * 200, op = p > 0 ? 1 : 0, sc = 1, filt = 'none';
      if (i === 0) {
        const gl = easeOut(seg(u, 1.95, 2.3));
        el.style.boxShadow = `0 0 ${60 * gl}px rgba(252,209,22,${0.9 * gl}),0 30px 70px rgba(0,0,0,.35)`;
        el.style.outline = gl > 0 ? `${6 * gl}px solid rgba(252,209,22,${gl})` : 'none';
      } else {
        const s = easeInOut(seg(u, 2.2 + i * 0.12, 3.1 + i * 0.12));
        y += s * 900; sc = 1 - 0.12 * s; filt = `grayscale(1) brightness(${1 - 0.45 * seg(u, 2.0, 2.4)})`; op *= 1 - s * 0.6;
      }
      el.style.transform = `translateY(${y}px) scale(${sc})`; el.style.opacity = op; el.style.filter = filt;
    }
  },
  s4(u) {
    const d = seg(u, 0.1, 0.75);   // pin drops and bounces
    const y = d < 1 ? lerp(-420, 640, easeInOut(d)) : 640 - Math.abs(Math.sin(seg(u, 0.75, 1.35) * Math.PI * 2)) * 60 * (1 - seg(u, 0.75, 1.35));
    $('s4pin').style.top = y + 'px';
    const w = seg(u, 1.0, 1.4);
    $('s4word').style.opacity = w; $('s4word').style.transform = `translateY(${(1 - easeOut(w)) * 40}px)`;
    $('s4flag').style.clipPath = `inset(0 ${100 - 100 * easeOut(seg(u, 1.3, 1.9))}% 0 0)`;
  },
  s5(u) {
    heads('s5', u);
    const isl = seg(u, 0.3, 0.8);
    $('s5island').style.transform = `scale(${pop(isl)})`; $('s5island').style.opacity = isl > 0 ? 1 : 0;
    pins5.forEach((_, i) => {
      const p = seg(u, 0.9 + i * 0.18, 1.2 + i * 0.18), el = $('q' + i);
      el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `translateY(${(1 - easeOut(p)) * -260}px) scale(${pop(seg(u, 1.1 + i * 0.18, 1.4 + i * 0.18))})`;
    });
    const b = seg(u, 2.2, 2.55);
    $('s5bar').style.transform = `scale(${pop(b)})`; $('s5bar').style.opacity = b > 0 ? 1 : 0;
    typeInto($('s5typed'), 'wedding caterer', u, 2.6, 3.4);
  },
  s6(u) {
    heads('s6', u);
    const b = seg(u, 0.2, 0.55);
    $('s6bar').style.transform = `scale(${pop(b)})`; $('s6bar').style.opacity = b > 0 ? 1 : 0;
    typeInto($('s6typed'), 'nail technician', u, 0.6, 1.3);
    biz6.forEach((_, i) => {
      const p = seg(u, 1.4 + i * 0.22, 1.9 + i * 0.22), el = $('b' + i);
      let s = 1;
      if (i === 1) s = 1 + 0.08 * easeOut(seg(u, 2.6, 3.0));
      el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `translateX(${(1 - easeOut(p)) * 700}px) scale(${s})`;
    });
  },
  s7(u) {
    heads('s7', u);
    for (let i = 0; i < 3; i++) {
      const p = seg(u, 0.5 + i * 0.2, 0.85 + i * 0.2), el = $('c' + i);
      el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `scale(${pop(p)})`;
      const r = $('cr' + i), q = seg(u, 1.4 + i * 0.5, 2.2 + i * 0.5), s = 240 + easeOut(q) * 220;
      r.style.width = r.style.height = s + 'px'; r.style.left = 120 - s / 2 + 'px'; r.style.top = 120 - s / 2 + 'px';
      r.style.opacity = q <= 0 || q >= 1 ? 0 : 1 - q;
    }
    $('c2ok').style.transform = `scale(${pop(seg(u, 2.9, 3.25))})`;
  },
  s8(u) {
    heads('s8', u);
    const ph = seg(u, 0.3, 0.75);
    $('s8phone').style.transform = `scale(${pop(ph)})`; $('s8phone').style.opacity = ph > 0 ? 1 : 0;
    $('s8glow').style.opacity = easeOut(seg(u, 0.8, 3.2)); $('s8glow').style.transform = `scale(${0.7 + 0.35 * easeOut(seg(u, 0.8, 3.2))})`;
    for (let i = 0; i < 4; i++) {
      const p = seg(u, 0.9 + i * 0.45, 1.25 + i * 0.45), el = $('n' + i);
      el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `translateY(${(1 - easeOut(p)) * -120}px) scale(${pop(p)})`;
    }
  },
  s9(u) {
    const p = seg(u, 0.1, 0.5);
    $('s9pin').style.opacity = p; $('s9pin').style.transform = `scale(${pop(p)}) scaleX(${Math.cos(Math.max(0, u - 0.5) * 2.4)})`;
    const w = seg(u, 0.5, 0.9);
    $('s9word').style.opacity = w; $('s9word').style.transform = `translateY(${(1 - easeOut(w)) * 40}px)`;
    $('s9flag').style.clipPath = `inset(0 ${100 - 100 * easeOut(seg(u, 0.8, 1.4))}% 0 0)`;
    const l = seg(u, 1.3, 1.7), url = seg(u, 1.6, 2.0);
    $('s9list').style.opacity = l;
    $('s9url').style.opacity = url; $('s9url').style.transform = `scale(${pop(url)})`;
  },
};

function background(t) {
  const a = easeInOut(seg(t, 13.5, 15.3));   // the sunrise
  $('bgAfter').style.opacity = a; $('glowA').style.opacity = a; $('glowB').style.opacity = 1 - a;
  const sun = $('sun'), size = lerp(260, 220, a), right = lerp(-90, 70, a), top = lerp(-120, 50, a);
  sun.style.width = sun.style.height = size + 'px'; sun.style.right = right + 'px'; sun.style.top = top + 'px';
  sun.style.opacity = lerp(0.72 + 0.05 * Math.sin(t * 1.5), 1, a);
  sun.style.boxShadow = `0 0 ${lerp(40, 120, a)}px rgba(252,209,22,${lerp(0.35, 0.85, a)})`;
  sun.style.background = a < 1 ? `rgb(${lerp(232, 252, a)},${lerp(185, 209, a)},${lerp(23, 22, a)})` : '#FCD116';
  [...document.querySelectorAll('.ray')].forEach((r, i) => {
    r.style.right = right + size / 2 - 4 + 'px'; r.style.top = top + size / 2 + 'px';
    r.style.transform = `rotate(${25 + i * 25 + Math.sin(t * 0.6) * 3}deg)`; r.style.opacity = a;
  });
  [...document.querySelectorAll('.wave')].forEach((w, i) => {
    w.style.opacity = lerp(0.05, 0.18, a); w.style.transform = `translateX(${-120 + Math.sin(t * 0.8 + i) * 60}px)`;
  });
}

window.render = function (t) {
  background(t);
  SCENES.forEach(([id, a, b], k) => {
    const el = $(id), u = t - a, d = b - a;
    if (u < 0 || u >= d) { el.style.opacity = 0; return; }
    draw[id](u);
    const last = k === SCENES.length - 1;
    const bin = 1 - seg(u, 0, 0.3), bout = last ? 0 : seg(u, d - 0.45, d);
    const fade = last ? seg(u, d - 0.4, d) : 0;
    el.style.opacity = (1 - 0.85 * bout) * (1 - fade) * (1 - 0.6 * bin);
    el.style.filter = bin + bout > 0 ? `blur(${(bin * 16 + bout * 26).toFixed(1)}px)` : 'none';
    el.style.transform = `scale(${1 + 0.03 * (u / d)})`;
  });
};

const q = new URLSearchParams(location.search);
if (!q.has('record')) {
  const t0 = performance.now();
  const loop = () => { window.render(((performance.now() - t0) / 1000) % (END + 1)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else window.render(Number(q.get('t') || 0));
</script>
</body></html>
