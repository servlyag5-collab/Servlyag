<!doctype html>
<html><head><meta charset="utf-8"><title>Servly ad 1 scene 1</title>
<!-- Scene 1 "The hook" (BEFORE look). Every frame is drawn from render(t), t in seconds (0-5),
     so recording is exact and repeatable. Open in a browser to preview it playing. -->
<style>
  @font-face{font-family:Bricolage;src:url(../../../node_modules/@expo-google-fonts/bricolage-grotesque/800ExtraBold/BricolageGrotesque_800ExtraBold.ttf);font-weight:800}
  @font-face{font-family:Bricolage;src:url(../../../node_modules/@expo-google-fonts/bricolage-grotesque/700Bold/BricolageGrotesque_700Bold.ttf);font-weight:700}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#041729}
  #stage{position:absolute;inset:0;background:linear-gradient(180deg,#0A2F52 0%,#072441 55%,#041729 100%);overflow:hidden}
  .abs{position:absolute}
  #glow{right:-440px;top:-500px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(252,209,22,.16) 0%,rgba(252,209,22,.05) 40%,rgba(252,209,22,0) 70%)}
  #sun{right:-90px;top:-120px;width:260px;height:260px;border-radius:50%;background:#E8B917;box-shadow:0 0 40px rgba(252,209,22,.35);opacity:.75}
  .wave{left:0;width:1300px;height:3px;background:rgba(255,255,255,.05)}
  /* headline (top quarter), word by word, key word in gold */
  #head{left:80px;right:80px;top:250px;text-align:center;font-family:Bricolage;font-weight:800;font-size:84px;line-height:1.08;color:#fff;letter-spacing:-1px}
  #head span{display:inline-block;opacity:0}
  #head .gold{color:#FCD116}
  /* the post card */
  #card{left:190px;top:760px;width:700px;height:400px;border-radius:44px;background:#fff;box-shadow:0 34px 80px rgba(0,0,0,.45);transform-origin:50% 50%}
  #words{position:absolute;left:56px;right:56px;top:66px;font-family:Bricolage;font-weight:800;font-size:58px;line-height:1.1;color:#14212B}
  #words small{display:block;font-family:"Segoe UI",sans-serif;font-weight:600;font-size:34px;color:#5A6B70;margin-top:16px}
  #rule{position:absolute;left:56px;right:56px;bottom:116px;height:3px;background:#E7E5DE;border-radius:2px}
  #icons{position:absolute;left:56px;right:56px;bottom:40px;height:56px;display:flex;align-items:center;gap:30px}
  #icons svg{stroke:#14212B;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #tick{margin-left:auto;width:56px;height:56px;border-radius:50%;background:#0072C6;display:flex;align-items:center;justify-content:center}
  #tick:before{content:"";width:22px;height:12px;border-left:6px solid #fff;border-bottom:6px solid #fff;transform:rotate(-45deg) translate(2px,-3px)}
  .ring{left:540px;top:960px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:5px solid rgba(252,209,22,.9);box-sizing:border-box}
</style></head>
<body>
<div id="stage">
  <div id="glow" class="abs"></div><div id="sun" class="abs"></div>
  <div class="wave abs" id="w1" style="top:1620px"></div><div class="wave abs" id="w2" style="top:1680px"></div>
  <div class="wave abs" id="w3" style="top:1740px"></div><div class="wave abs" id="w4" style="top:1800px"></div>
  <div id="head" class="abs"><span>Antigua</span> <span>&amp;</span> <span>Barbuda</span><br><span class="gold">businesses</span></div>
  <div class="ring abs" id="r1"></div><div class="ring abs" id="r2"></div>
  <div id="card" class="abs">
    <div id="words">Weekend special!<small>Book now · Gel nails all week</small></div>
    <div id="rule"></div>
    <div id="icons">
      <svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 44S6 32 6 18a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 14-20 26-20 26z"/></svg>
      <svg width="52" height="52" viewBox="0 0 52 52"><path d="M46 6L6 22l16 6 6 16z"/><path d="M46 6L22 28"/></svg>
      <div id="tick"></div>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));            // 0..1 progress between a and b
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const backOut = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // pop with overshoot
  const words = [...document.querySelectorAll('#head span')];

  window.render = function (t) {
    // slow push-in on the whole scene, sea lines drifting
    const push = 1 + 0.035 * (t / 5);
    $('stage').style.transform = `scale(${push})`;
    ['w1', 'w2', 'w3', 'w4'].forEach((w, i) => { $(w).style.transform = `translateX(${-120 + Math.sin(t * 0.8 + i) * 60}px)`; });
    $('sun').style.opacity = 0.7 + 0.05 * Math.sin(t * 1.5);

    // headline: word by word from 0.2s, each pops up
    words.forEach((w, i) => {
      const p = seg(t, 0.2 + i * 0.28, 0.55 + i * 0.28);
      w.style.opacity = p; w.style.transform = `translateY(${(1 - easeOut(p)) * 40}px)`;
    });

    // card pops in 0.5-1.1s with overshoot
    const c = seg(t, 0.5, 1.1);
    const s = c === 0 ? 0.001 : backOut(c);
    // card dulls to grey 3.4-4.4s, as if ignored
    const g = easeOut(seg(t, 3.4, 4.4));
    $('card').style.transform = `scale(${s}) rotate(${(1 - c) * -4}deg)`;
    $('card').style.opacity = c > 0 ? 1 : 0;
    $('card').style.filter = `grayscale(${g}) brightness(${1 - 0.38 * g})`;

    // blue tick pops at 1.4s
    const k = seg(t, 1.4, 1.75);
    $('tick').style.transform = `scale(${k === 0 ? 0 : backOut(k)})`;

    // two golden rings ripple out and fade to nothing (nobody there)
    [['r1', 1.9], ['r2', 2.45]].forEach(([id, start]) => {
      const p = seg(t, start, start + 1.5);
      const size = 10 + easeOut(p) * 1100;
      const el = $(id);
      el.style.width = el.style.height = size + 'px';
      el.style.margin = `${-size / 2}px 0 0 ${-size / 2}px`;
      el.style.opacity = p === 0 || p === 1 ? 0 : (1 - p) * 0.9;
    });

    // blur-out 4.4-5.0s
    const b = seg(t, 4.4, 5.0);
    document.body.style.filter = b > 0 ? `blur(${b * 28}px)` : 'none';
    document.body.style.opacity = 1 - 0.85 * b;
  };

  // In a normal browser: play it on a loop. The recorder calls render(t) itself (?record).
  if (!location.search.includes('record')) {
    const t0 = performance.now();
    const loop = () => { window.render(((performance.now() - t0) / 1000) % 5.5); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else { window.render(Number(new URLSearchParams(location.search).get('t') || 0)); }
</script>
</body></html>
