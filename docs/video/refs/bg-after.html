<!doctype html><html><head><meta charset="utf-8"><title>Servly background after</title><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
/* bright airy morning: soft sky blue at the top, Servly blue in the middle, the harbour navy sea at the bottom */
body{background:linear-gradient(180deg,#BFE2F8 0%,#8CC6EE 30%,#3F92D6 62%,#0B3A63 86%,#0A3157 100%);position:relative}
.glow{position:absolute;right:-300px;top:-300px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.75) 0%,rgba(255,236,150,.25) 35%,rgba(255,236,150,0) 70%)}
.sun{position:absolute;right:80px;top:150px;width:240px;height:240px;border-radius:50%;background:#FCD116;box-shadow:0 0 120px rgba(252,209,22,.85)}
.ray{position:absolute;right:198px;top:270px;width:8px;height:260px;background:rgba(252,209,22,.65);border-radius:4px;transform-origin:50% 0}
.wave{position:absolute;left:0;width:1080px;height:3px;background:rgba(255,255,255,.18)}
</style></head><body>
<div class="glow"></div>
<div class="ray" style="transform:rotate(25deg)"></div><div class="ray" style="transform:rotate(50deg)"></div><div class="ray" style="transform:rotate(75deg)"></div><div class="ray" style="transform:rotate(100deg)"></div>
<div class="sun"></div>
<div class="wave" style="top:1640px"></div><div class="wave" style="top:1700px;left:120px"></div><div class="wave" style="top:1760px;left:-80px"></div><div class="wave" style="top:1820px;left:200px"></div>
</body></html>
