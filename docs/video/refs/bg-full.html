<!doctype html><html><head><meta charset="utf-8"><title>Servly background</title><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(180deg,#0B3A63 0%,#0A3157 60%,#082848 100%);position:relative}
.glow{position:absolute;right:-260px;top:-260px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(252,209,22,.38) 0%,rgba(252,209,22,.08) 40%,rgba(252,209,22,0) 70%)}
.sun{position:absolute;right:90px;top:160px;width:220px;height:220px;border-radius:50%;background:#FCD116;box-shadow:0 0 90px rgba(252,209,22,.6);opacity:1}
.ray{position:absolute;right:200px;top:270px;width:6px;height:200px;background:rgba(252,209,22,.55);border-radius:3px;transform-origin:50% 0}
.wave{position:absolute;left:0;width:1080px;height:3px;background:rgba(255,255,255,.06)}
</style></head><body>
<div class="glow"></div>
<div class="ray" style="transform:rotate(25deg)"></div><div class="ray" style="transform:rotate(55deg)"></div><div class="ray" style="transform:rotate(85deg)"></div>
<div class="sun"></div>
<div class="wave" style="top:1620px"></div><div class="wave" style="top:1680px;left:120px"></div><div class="wave" style="top:1740px;left:-80px"></div><div class="wave" style="top:1800px;left:200px"></div>
</body></html>
