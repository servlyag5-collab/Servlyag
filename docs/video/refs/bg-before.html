<!doctype html><html><head><meta charset="utf-8"><title>Servly background before</title><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(180deg,#0A2F52 0%,#072441 55%,#041729 100%);position:relative}
.glow{position:absolute;right:-440px;top:-500px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(252,209,22,.16) 0%,rgba(252,209,22,.05) 40%,rgba(252,209,22,0) 70%)}
.sun{position:absolute;right:-90px;top:-120px;width:260px;height:260px;border-radius:50%;background:#E8B917;box-shadow:0 0 40px rgba(252,209,22,.35);opacity:.75}
.wave{position:absolute;left:0;width:1080px;height:3px;background:rgba(255,255,255,.05)}
</style></head><body>
<div class="glow"></div><div class="sun"></div>
<div class="wave" style="top:1620px"></div><div class="wave" style="top:1680px;left:120px"></div><div class="wave" style="top:1740px;left:-80px"></div><div class="wave" style="top:1800px;left:200px"></div>
</body></html>
